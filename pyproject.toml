[build-system]
requires = ["setuptools>=80.9,<81", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-runtime"
dynamic = ["version"]
description = "Portable Agency Runtime Control Plane — specialist routing, roster governance, delegation, and model/run observability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Agency Runtime Contributors"}]
keywords = ["agents", "delegation", "observability", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=4.0,<8",
]
release = [
    "build==1.3.0",
    "twine==6.2.0",
]
security = [
    "bandit==1.8.6",
    "pip-audit==2.9.0",
]

[project.urls]
Homepage = "https://github.com/Holeshot-Software-LLC/agency-runtime"
Issues = "https://github.com/Holeshot-Software-LLC/agency-runtime/issues"
Repository = "https://github.com/Holeshot-Software-LLC/agency-runtime.git"

[project.scripts]
agency = "agency_runtime.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "agency_runtime.__version__"}

[tool.setuptools.packages.find]
include = ["agency_runtime*"]

[tool.setuptools.package-data]
agency_runtime = [
    "core/config_defaults.yaml",
    "core/companion_policy.yaml",
    "dashboard/*.html",
    "dashboard/*.css",
    "dashboard/*.js",
    "core/evals/data/*.json",
    "core/evals/data/*.yaml",
    "core/evals/data/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
