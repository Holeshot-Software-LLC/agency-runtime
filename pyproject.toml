[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-runtime"
dynamic = ["version"]
description = "Portable Agency Runtime Control Plane — specialist routing, roster governance, delegation, and model/run observability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Agency Runtime Contributors"}]
keywords = ["agents", "delegation", "observability", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]==7.15.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]
release = [
    "build==1.5.1",
    "twine==6.2.0",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "zizmor==1.26.1",
]

[project.urls]
Changelog = "https://github.com/Holeshot-Software-LLC/agency-runtime/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Holeshot-Software-LLC/agency-runtime#readme"
Homepage = "https://github.com/Holeshot-Software-LLC/agency-runtime"
Issues = "https://github.com/Holeshot-Software-LLC/agency-runtime/issues"
Repository = "https://github.com/Holeshot-Software-LLC/agency-runtime.git"
Security = "https://github.com/Holeshot-Software-LLC/agency-runtime/security/policy"

[project.scripts]
agency = "agency_runtime.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "agency_runtime.__version__"}

[tool.setuptools.packages.find]
include = ["agency_runtime*"]

[tool.setuptools.package-data]
agency_runtime = [
    "core/config_defaults.yaml",
    "core/companion_policy.yaml",
    "dashboard/*.html",
    "dashboard/*.css",
    "dashboard/*.js",
    "dashboard/package.json",
    "core/evals/data/*.json",
    "core/evals/data/*.yaml",
    "core/evals/data/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "performance: wall-clock performance gates that must run without coverage instrumentation",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "PERF203",  # Per-item failure isolation is intentional around I/O cleanup.
    "SIM108",   # Multi-step CLI branches are clearer than long conditional expressions.
]
select = [
    "ASYNC",
    "B",
    "C4",
    "C901",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PERF",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
branch = true
source = ["agency_runtime"]

[tool.coverage.report]
precision = 2
show_missing = true
