[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-runtime"
version = "0.1.0"
description = "Portable Agency Runtime Control Plane — specialist routing, roster governance, delegation, and model/run observability."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Agency Runtime Contributors"}]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
agency = "agency_runtime.cli.main:main"

[tool.setuptools.packages.find]
include = ["agency_runtime*"]

[tool.setuptools.package-data]
agency_runtime = ["core/config_defaults.yaml", "core/companion_policy.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
