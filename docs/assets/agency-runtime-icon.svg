<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Agency Runtime icon">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="ar-hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- rounded square backdrop -->
  <rect x="10" y="10" width="236" height="236" rx="52" fill="url(#ar-bg)"/>

  <!-- one coordinator recruiting a bench of specialists (hub-and-spoke) -->
  <g fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" opacity="0.45">
    <!-- spokes radiating from center (128,128) to six specialist nodes -->
    <line x1="128" y1="128" x2="128" y2="48"/>
    <line x1="128" y1="128" x2="197" y2="80"/>
    <line x1="128" y1="128" x2="208" y2="156"/>
    <line x1="128" y1="128" x2="160" y2="210"/>
    <line x1="128" y1="128" x2="96" y2="210"/>
    <line x1="128" y1="128" x2="48" y2="156"/>
    <line x1="128" y1="128" x2="59" y2="80"/>
  </g>

  <!-- specialist nodes (the roster) -->
  <g fill="#0b1220" stroke="#6366f1" stroke-width="5">
    <circle cx="128" cy="48" r="14"/>
    <circle cx="197" cy="80" r="14"/>
    <circle cx="208" cy="156" r="14"/>
    <circle cx="160" cy="210" r="14"/>
    <circle cx="96" cy="210" r="14"/>
    <circle cx="48" cy="156" r="14"/>
    <circle cx="59" cy="80" r="14"/>
  </g>

  <!-- central hub: the main agent / orchestrator -->
  <circle cx="128" cy="128" r="30" fill="url(#ar-hub)"/>
</svg>
