# ── Agency Runtime default configuration ──────────────────────────
# These defaults work for a fresh install with Ollama but no API keys.
# Override by creating ~/.agency-runtime/agency.yaml or setting env vars.
#
# The 'providers' list is the judge fallback chain. The judge tries each
# provider in order until one succeeds. If no providers are configured,
# it falls back to 'judge' (legacy), then 'ollama', then token-only.
#
# Provider types: openai-compatible, anthropic, ollama, litellm, cli
# Auth: api_key, api_key_env, OAuth session (cli), or none (loopback local)
#
# Env var overrides (highest precedence):
#   AGENCY_JUDGE_MODEL, AGENCY_JUDGE_BASE_URL, AGENCY_JUDGE_API_KEY,
#   AGENCY_JUDGE_TIMEOUT, AGENCY_MAX_SELECTED, AGENCY_BYPASS_THRESHOLD,
#   OLLAMA_BASE_URL, AGENCY_OLLAMA_FALLBACK_MODEL,
#   LITELLM_API_KEY,
#   AGENCY_CONFIG_PATH, AGENCY_DB_PATH, AGENCY_DASHBOARD_PORT

# Provider fallback chain — empty by default, populated by `agency configure`
providers: []

judge:
  model: qwen3.5:2b
  base_url: http://127.0.0.1:11434
  api_key_env: ""             # blank = no API key needed (Ollama)
  api_key: ""                 # direct key value (takes precedence over api_key_env)
  ollama_mode: true           # use /api/chat endpoint instead of /v1/chat/completions
  timeout: 15
  max_selected: 3
  confidence_bypass_threshold: 15.0

ollama:
  enabled: true
  base_url: http://127.0.0.1:11434
  model: qwen3.5:2b

selector:
  min_confidence: 0.8
  max_user_msg_len: 4000
  # Deprecated compatibility value; state-aware turn intent owns bypass policy.
  trivial_msg_threshold: 0

# Native hosts remain the scheduler. Observe emits optional plans without a
# Stop correction; prefer applies the bounded strength thresholds below;
# strong marks every eligible multi-unit plan strongly preferred.
delegation:
  mode: prefer
  preferred_min_units: 2
  strongly_preferred_min_units: 4
  strongly_preferred_min_confidence: 0.8
  # Parent-scoped protection for native children that were not pre-planned.
  child_inference_budget: 4
  child_inference_concurrency: 2
  child_cache_ttl_seconds: 900

# Planning uses configured inference whenever any provider is available. Every
# mode searches the complete local capability index through an inference planner
# and recruiter. Fast and balanced fund one bounded repair for each stage;
# strict also funds an independent critic.
workforce:
  mode: strict
  provider: ""                  # blank = use the configured provider chain
  planner_model: ""             # blank = provider's configured model/alias
  recruiter_model: ""
  hiring_model: ""
  critic_model: ""
  fast_call_budget: 4
  balanced_call_budget: 4
  strict_call_budget: 5
  hiring_call_budget: 4
  max_work_units: 16
  max_selected_per_unit: 4
  max_selected_total: 16
  min_confidence: 0.8
  min_margin: 0.1
  max_hires_per_task: 1
  max_hires_per_day: 3
  auto_promote_successes: 0     # zero keeps promotion human-controlled
  contractor_review_days: 30

# Reversible selection policy. Definitions and version history remain in the
# roster while listed specialists are unavailable to routing and new loads.
agents:
  disabled: []

store:
  db_path: ~/.agency-runtime/agency.db

server:
  host: 127.0.0.1
  port: 7800
  max_body_size: 16777216

dashboard:
  port: 7810

observability:
  capture_content: false
  retention_days: 30

adapters:
  litellm:
    enabled: auto
    base_url: http://127.0.0.1:4000
    api_key_env: LITELLM_API_KEY
    skip_models:
      - complexity_router
      - auto_router/
  hermes:
    enabled: auto
  openclaw:
    enabled: auto
  codex:
    enabled: auto
  claude:
    enabled: auto
  zcode:
    enabled: auto

profile: standard
companion_policy_path: null
