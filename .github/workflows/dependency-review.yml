name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Detect dependency review capability
        id: dependency-review-capability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          )"
          case "${status}" in
            200)
              echo 'available=true' >> "${GITHUB_OUTPUT}"
              ;;
            403|404)
              echo 'available=false' >> "${GITHUB_OUTPUT}"
              echo '::notice::GitHub dependency review is unavailable; running the exact installed-runtime audit fallback.'
              ;;
            *)
              echo "::error::Dependency review capability probe returned HTTP ${status}."
              exit 1
              ;;
          esac
      - name: Reject vulnerable dependency changes
        if: steps.dependency-review-capability.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
      - name: Set up fallback Python
        if: steps.dependency-review-capability.outputs.available == 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and pinned fallback audit tool
        if: steps.dependency-review-capability.outputs.available == 'false'
        run: |
          python -m pip install .
          python -m pip install "pip-audit==2.10.1"
      - name: Audit the exact installed runtime dependency
        if: steps.dependency-review-capability.outputs.available == 'false'
        run: python scripts/audit_runtime_dependencies.py
