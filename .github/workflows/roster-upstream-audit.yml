name: Upstream roster delta audit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-roster-audit
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quarantine-delta:
    name: quarantine changed definitions and publish review evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Agency Runtime
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check out upstream roster without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: msitarzewski/agency-agents
          path: .upstream/agency-agents
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime
        run: python -m pip install -e .
      - name: Inspect and quarantine only the upstream delta
        env:
          AGENCY_CONFIG_PATH: ${{ runner.temp }}/agency-runtime/agency.yaml
          AGENCY_DB_PATH: ${{ runner.temp }}/agency-runtime/agency.db
          AGENCY_JUDGE_API_KEY: ${{ secrets.AGENCY_ROSTER_AUDIT_API_KEY }}
          AGENCY_JUDGE_BASE_URL: ${{ vars.AGENCY_ROSTER_AUDIT_BASE_URL }}
          AGENCY_JUDGE_MODEL: ${{ vars.AGENCY_ROSTER_AUDIT_MODEL }}
          HOME: ${{ runner.temp }}/agency-home
          USERPROFILE: ${{ runner.temp }}/agency-home
        run: |
          agency source add "${GITHUB_WORKSPACE}/.upstream/agency-agents" --name "nightly-agency-agents"
          revision="$(git -C "${GITHUB_WORKSPACE}/.upstream/agency-agents" rev-parse HEAD)"
          agency roster upstream import --source-revision "${revision}" > roster-review.json
      - name: Publish content-free review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-roster-review-${{ github.run_id }}
          path: roster-review.json
          if-no-files-found: error
          retention-days: 30
