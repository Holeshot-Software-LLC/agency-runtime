name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: tests / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.12"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: ubuntu-24.04, python: "3.14"}
          - {os: windows-2022, python: "3.10"}
          - {os: windows-2022, python: "3.14"}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          AGENCY_CONFIG_PATH: ${{ runner.temp }}/agency-runtime/agency.yaml
          AGENCY_DB_PATH: ${{ runner.temp }}/agency-runtime/agency.db
          HOME: ${{ runner.temp }}/agency-home
          USERPROFILE: ${{ runner.temp }}/agency-home
        run: python -m pytest tests -q -p no:cacheprovider --basetemp "${{ runner.temp }}/pytest"
      - name: Verify documentation ledgers
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: |
          python scripts/docs_metadata.py --check
          python scripts/update_policy_availability.py --check
          python scripts/update_worklog.py --check
          python scripts/verify_docs.py
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check patch whitespace
        run: git diff --check

  artifacts:
    name: build and verify distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release tools
        run: python -m pip install "build==1.3.0" "twine==6.2.0"
      - name: Check tracked release inputs
        run: python scripts/verify_release_hygiene.py
      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel
      - name: Verify metadata and artifact contents
        run: |
          python -m twine check --strict dist/*
          python scripts/verify_distribution.py dist
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    name: wheel smoke / ${{ matrix.os }}
    needs: artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Set up minimum supported Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: ${{ runner.temp }}/agency-dist
      - name: Install and smoke-test only the built wheel in a clean environment
        working-directory: ${{ runner.temp }}
        shell: bash
        env:
          AGENCY_CONFIG_PATH: ${{ runner.temp }}/agency-runtime/agency.yaml
          AGENCY_DB_PATH: ${{ runner.temp }}/agency-runtime/agency.db
          HOME: ${{ runner.temp }}/agency-home
          USERPROFILE: ${{ runner.temp }}/agency-home
        run: |
          python -m venv wheel-smoke
          if [ "${RUNNER_OS}" = "Windows" ]; then
            PYTHON="./wheel-smoke/Scripts/python.exe"
            AGENCY="./wheel-smoke/Scripts/agency.exe"
          else
            PYTHON="./wheel-smoke/bin/python"
            AGENCY="./wheel-smoke/bin/agency"
          fi
          "${PYTHON}" -m pip install --only-binary=:all: agency-dist/*.whl
          "${PYTHON}" -I -c "from importlib.metadata import version; from importlib.resources import files; import agency_runtime; from agency_runtime.core.canary import run_canary; assert callable(run_canary); assert version('agency-runtime') == agency_runtime.__version__; assert files('agency_runtime.dashboard').joinpath('index.html').is_file(); assert files('agency_runtime.core').joinpath('canary.py').is_file(); assert files('agency_runtime.core.evals.data').joinpath('routing_v1.py').is_file()"
          "${AGENCY}" --help
          "${AGENCY}" host-canary --help
          "${PYTHON}" -m pip check

  security:
    name: deterministic source checks and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and pinned security tools
        run: python -m pip install ".[security]"
      - name: Check tracked files and high-severity source findings
        run: |
          python scripts/verify_release_hygiene.py
          python -m bandit -q -r agency_runtime -lll
      - name: Audit the exact installed runtime dependency
        shell: bash
        run: |
          python -c "from importlib.metadata import version; print('PyYAML==' + version('PyYAML'))" > "${RUNNER_TEMP}/runtime-dependencies.txt"
          python -m pip_audit --strict --no-deps --requirement "${RUNNER_TEMP}/runtime-dependencies.txt"
