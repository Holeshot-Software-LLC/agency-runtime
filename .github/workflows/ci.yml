name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality-contracts:
    name: static quality, documentation, and dashboard UI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check Python code quality
        run: |
          ruff check agency_runtime tests scripts
          ruff format --check agency_runtime tests scripts
      - name: Verify fast workflow and documentation contracts
        run: |
          python scripts/docs_metadata.py --check
          python scripts/update_policy_availability.py --check
          python scripts/update_worklog.py --check
          python scripts/verify_docs.py --require-tracker
          python -m pytest tests/test_ci_sharding.py tests/test_release_packaging.py -q -W error
      - name: Run dashboard UI tests with coverage
        run: >-
          node --test --experimental-test-coverage
          --test-coverage-lines=95 --test-coverage-branches=90
          --test-coverage-functions=96 tests/dashboard_ui.test.mjs

  coverage:
    name: coverage / shard ${{ matrix.label }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {index: 0, label: 1}
          - {index: 1, label: 2}
          - {index: 2, label: 3}
          - {index: 3, label: 4}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Prepare private coverage runtime
        shell: bash
        env:
          AGENCY_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENCY_CI_RUN_ID: ${{ github.run_id }}
          AGENCY_CI_SHARD: ${{ matrix.index }}
        run: >-
          python -m scripts.prepare_ci_runtime
          --label "coverage-${AGENCY_CI_SHARD}-${AGENCY_CI_RUN_ID}-${AGENCY_CI_RUN_ATTEMPT}"
      - name: Run warning-strict coverage shard
        shell: bash
        env:
          AGENCY_CI_SHARD: ${{ matrix.index }}
        run: |
          export HOME="${AGENCY_CI_HOME}"
          export USERPROFILE="${AGENCY_CI_HOME}"
          export TMPDIR="${AGENCY_CI_TEMP}"
          unset AGENCY_CONFIG_PATH AGENCY_DB_PATH
          mapfile -t TEST_FILES < <(python -m scripts.select_test_shard \
            --index "${AGENCY_CI_SHARD}" --count 4)
          test "${#TEST_FILES[@]}" -gt 0
          "${AGENCY_CI_PYTHON}" -m pytest "${TEST_FILES[@]}" -q -W error \
            -p no:cacheprovider -m "not performance" \
            --basetemp "${AGENCY_CI_TEMP}/pytest-coverage" \
            --cov=agency_runtime \
            --cov=scripts.build_distributions \
            --cov=scripts.canonicalize_distributions \
            --cov=scripts.prove_autocrlf_checkout \
            --cov=scripts.release_contract \
            --cov=scripts.release_git \
            --cov=scripts.verify_distribution \
            --cov-branch --cov-report=
          mv .coverage ".coverage.${AGENCY_CI_SHARD}"
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.index }}
          path: .coverage.${{ matrix.index }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-complete:
    name: coverage / combined
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install coverage
        run: python -m pip install "coverage[toml]==7.15.0"
      - name: Download coverage shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage-shards
          merge-multiple: true
      - name: Require combined 100% line and branch coverage
        run: |
          python -m coverage combine "${RUNNER_TEMP}/coverage-shards"
          python -m coverage report --fail-under=97

  performance:
    name: uninstrumented wall-clock performance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Prepare private performance runtime
        shell: bash
        env:
          AGENCY_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENCY_CI_RUN_ID: ${{ github.run_id }}
        run: >-
          python -m scripts.prepare_ci_runtime
          --label "performance-${AGENCY_CI_RUN_ID}-${AGENCY_CI_RUN_ATTEMPT}"
      - name: Run uninstrumented wall-clock performance gates
        shell: bash
        run: |
          export HOME="${AGENCY_CI_HOME}"
          export USERPROFILE="${AGENCY_CI_HOME}"
          export TMPDIR="${AGENCY_CI_TEMP}"
          unset AGENCY_CONFIG_PATH AGENCY_DB_PATH
          "${AGENCY_CI_PYTHON}" -m pytest tests -q -W error -p no:cacheprovider \
            -m performance \
            --basetemp "${AGENCY_CI_TEMP}/pytest-performance"

  test:
    name: tests / ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.11"}
          - {os: ubuntu-24.04, python: "3.12"}
          - {os: ubuntu-24.04, python: "3.13"}
          - {os: ubuntu-24.04, python: "3.14"}
          - {os: windows-2022, python: "3.10"}
          - {os: windows-2022, python: "3.14"}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Prepare private test runtime
        shell: bash
        env:
          AGENCY_CI_MATRIX_PYTHON: ${{ matrix.python }}
          AGENCY_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENCY_CI_RUN_ID: ${{ github.run_id }}
        run: >-
          python -m scripts.prepare_ci_runtime
          --label "tests-py${AGENCY_CI_MATRIX_PYTHON}-${AGENCY_CI_RUN_ID}-${AGENCY_CI_RUN_ATTEMPT}"
      - name: Run tests
        shell: bash
        run: |
          export HOME="${AGENCY_CI_HOME}"
          export USERPROFILE="${AGENCY_CI_HOME}"
          export TMPDIR="${AGENCY_CI_TEMP}"
          unset AGENCY_CONFIG_PATH AGENCY_DB_PATH
          "${AGENCY_CI_PYTHON}" -m pytest tests -q -W error -p no:cacheprovider \
            -m "not performance" \
            --basetemp "${AGENCY_CI_TEMP}/pytest"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check patch whitespace
        run: git diff --check
      - name: Check out canonical documentation history
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify documentation ledgers
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        env:
          EXPECTED_HISTORY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HISTORY_HEAD}"
          python scripts/docs_metadata.py --check
          python scripts/update_policy_availability.py --check
          python scripts/update_worklog.py --check
          python scripts/verify_docs.py --require-tracker

  windows-portability-contract:
    name: portability contract / windows / py${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Prepare private test runtime
        shell: bash
        env:
          AGENCY_CI_MATRIX_PYTHON: ${{ matrix.python }}
          AGENCY_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENCY_CI_RUN_ID: ${{ github.run_id }}
        run: >-
          python -m scripts.prepare_ci_runtime
          --label "portability-py${AGENCY_CI_MATRIX_PYTHON}-${AGENCY_CI_RUN_ID}-${AGENCY_CI_RUN_ATTEMPT}"
      - name: Exercise canonical archives and atomic Windows processes
        shell: bash
        run: |
          export HOME="${AGENCY_CI_HOME}"
          export USERPROFILE="${AGENCY_CI_HOME}"
          export TMPDIR="${AGENCY_CI_TEMP}"
          unset AGENCY_CONFIG_PATH AGENCY_DB_PATH
          "${AGENCY_CI_PYTHON}" -m pytest \
            tests/test_canonicalize_distributions.py \
            tests/test_owned_binary_process.py \
            tests/test_owned_process_core_hardening.py \
            tests/test_owned_process_windows_atomic.py \
            -q -W error -p no:cacheprovider \
            --basetemp "${AGENCY_CI_TEMP}/pytest-portability"

  artifacts:
    name: build and verify distributions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04}
          - {os: windows-2022}
    env:
      AGENCY_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install release tools
        run: python -m pip install "build==1.5.0" "twine==6.2.0"
      - name: Smoke release modules without installing the project
        run: |
          python -m scripts.build_distributions --help
          python -m scripts.verify_distribution --help
      - name: Prepare private release runtime
        shell: bash
        env:
          AGENCY_CI_MATRIX_OS: ${{ matrix.os }}
          AGENCY_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENCY_CI_RUN_ID: ${{ github.run_id }}
        run: >-
          python -m scripts.prepare_ci_runtime
          --label "artifacts-${AGENCY_CI_MATRIX_OS}-${AGENCY_CI_RUN_ID}-${AGENCY_CI_RUN_ATTEMPT}"
      - name: Bind private release output
        id: release-output
        shell: bash
        run: printf 'path=%s\n' "${AGENCY_CI_TEMP}/dist" >> "${GITHUB_OUTPUT}"
      - name: Check tracked release inputs
        run: python scripts/verify_release_hygiene.py
      - name: Prove clean CRLF checkout uses canonical Git blobs
        shell: bash
        run: >-
          "${AGENCY_CI_PYTHON}" -m scripts.prove_autocrlf_checkout
          --expected-commit "${AGENCY_RELEASE_COMMIT}"
      - name: Build wheel and source distribution
        shell: bash
        run: >-
          "${AGENCY_CI_PYTHON}" -m scripts.build_distributions "${AGENCY_CI_TEMP}/dist"
          --expected-commit "${AGENCY_RELEASE_COMMIT}"
      - name: Verify metadata and artifact contents
        shell: bash
        run: |
          "${AGENCY_CI_PYTHON}" -m twine check --strict "${AGENCY_CI_TEMP}"/dist/*
          "${AGENCY_CI_PYTHON}" -m scripts.verify_distribution "${AGENCY_CI_TEMP}/dist" \
            --expected-commit "${AGENCY_RELEASE_COMMIT}"
      - name: Upload platform distributions for byte-parity verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions-${{ matrix.os }}
          path: ${{ steps.release-output.outputs.path }}/*
          if-no-files-found: error
          retention-days: 7
  artifact-parity:
    name: artifact byte parity / windows and linux
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download Linux distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-ubuntu-24.04
          path: ${{ runner.temp }}/agency-dist-linux
      - name: Download Windows distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions-windows-2022
          path: ${{ runner.temp }}/agency-dist-windows
      - name: Require one byte-identical cross-platform artifact pair
        shell: bash
        run: |
          test "$(find "${RUNNER_TEMP}/agency-dist-linux" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "${RUNNER_TEMP}/agency-dist-windows" -maxdepth 1 -type f | wc -l)" -eq 2
          diff --brief --recursive \
            "${RUNNER_TEMP}/agency-dist-linux" \
            "${RUNNER_TEMP}/agency-dist-windows"
      - name: Publish verified canonical distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/agency-dist-linux/*
          if-no-files-found: error
          retention-days: 7

  artifact-smoke:
    name: artifact smoke / ${{ matrix.os }}
    needs: [artifacts, artifact-parity]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out release smoke procedure
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up minimum supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Set up Node.js for generated OpenClaw syntax validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: ${{ runner.temp }}/agency-dist
      - name: Prepare private artifact runtime
        shell: bash
        env:
          AGENCY_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGENCY_CI_RUN_ID: ${{ github.run_id }}
        run: >-
          python -m scripts.prepare_ci_runtime
          --label "artifact-smoke-${AGENCY_CI_RUN_ID}-${AGENCY_CI_RUN_ATTEMPT}"
      - name: Install and smoke-test the built wheel and source distribution
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          EXPECTED_VERSION="$(python "${GITHUB_WORKSPACE}/scripts/read_release_version.py" "${GITHUB_WORKSPACE}/agency_runtime/__init__.py")"
          wheel_artifacts=(agency-dist/*.whl)
          sdist_artifacts=(agency-dist/*.tar.gz)
          if [ "${#wheel_artifacts[@]}" -ne 1 ] || [ ! -f "${wheel_artifacts[0]}" ]; then
            exit 1
          fi
          if [ "${#sdist_artifacts[@]}" -ne 1 ] || [ ! -f "${sdist_artifacts[0]}" ]; then
            exit 1
          fi

          python -m venv --copies "${AGENCY_CI_TEMP}/wheel-smoke"
          python -m venv --copies "${AGENCY_CI_TEMP}/sdist-smoke"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            WHEEL_PYTHON="${AGENCY_CI_TEMP}/wheel-smoke/Scripts/python.exe"
            WHEEL_AGENCY="${AGENCY_CI_TEMP}/wheel-smoke/Scripts/agency.exe"
            SDIST_PYTHON="${AGENCY_CI_TEMP}/sdist-smoke/Scripts/python.exe"
            SDIST_AGENCY="${AGENCY_CI_TEMP}/sdist-smoke/Scripts/agency.exe"
          else
            WHEEL_PYTHON="${AGENCY_CI_TEMP}/wheel-smoke/bin/python"
            WHEEL_AGENCY="${AGENCY_CI_TEMP}/wheel-smoke/bin/agency"
            SDIST_PYTHON="${AGENCY_CI_TEMP}/sdist-smoke/bin/python"
            SDIST_AGENCY="${AGENCY_CI_TEMP}/sdist-smoke/bin/agency"
          fi

          smoke_distribution() {
            local label="$1"
            local python="$2"
            local agency="$3"
            local artifact="$4"
            export AGENCY_CONFIG_PATH="${AGENCY_CI_TEMP}/agency-${label}/agency.yaml"
            export AGENCY_DB_PATH="${AGENCY_CI_TEMP}/agency-${label}/agency.db"
            export HOME="${AGENCY_CI_HOME}/${label}"
            export USERPROFILE="${AGENCY_CI_HOME}/${label}"
            export TMPDIR="${AGENCY_CI_TEMP}"
            mkdir -p "${HOME}"
            chmod 700 "${HOME}"
            "${python}" -m pip install --no-cache-dir --only-binary=:all: "${artifact}"
            "${python}" -I -c "from importlib.metadata import version; from importlib.resources import files; import agency_runtime; from agency_runtime.core.canary import run_canary; assert callable(run_canary); assert version('agency-runtime') == agency_runtime.__version__; assert files('agency_runtime.dashboard').joinpath('index.html').is_file(); assert files('agency_runtime.core').joinpath('canary.py').is_file(); assert files('agency_runtime.core.evals.data').joinpath('routing_v1.py').is_file()"
            "${python}" -I "${GITHUB_WORKSPACE}/scripts/smoke_installed_distribution.py" --expected-version "${EXPECTED_VERSION}"
            "${python}" -I -c 'import subprocess, sys; result = subprocess.run([sys.argv[1], "--version"], capture_output=True, text=True, check=False); expected = f"agency {sys.argv[2]}\n"; assert (result.returncode, result.stdout, result.stderr) == (0, expected, ""), (result.returncode, result.stdout, result.stderr)' "${agency}" "${EXPECTED_VERSION}"
            "${agency}" --help
            "${agency}" host-canary --help
            "${agency}" smoke --all --json
            "${agency}" config show
            "${python}" -m pip check
          }

          smoke_distribution wheel "${WHEEL_PYTHON}" "${WHEEL_AGENCY}" "${wheel_artifacts[0]}"
          smoke_distribution sdist "${SDIST_PYTHON}" "${SDIST_AGENCY}" "${sdist_artifacts[0]}"

  security:
    name: deterministic source checks and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and pinned security tools
        run: python -m pip install ".[security]"
      - name: Check tracked files and high-severity source findings
        run: |
          python scripts/verify_release_hygiene.py
          python -m bandit -q -r agency_runtime scripts -lll
          zizmor --pedantic --strict-collection --offline .
      - name: Audit the exact installed runtime dependency
        run: python scripts/audit_runtime_dependencies.py

  quality:
    # Preserve the established branch-protection check name as an aggregate gate.
    name: lint, coverage, performance, and dashboard UI
    if: always()
    needs:
      - quality-contracts
      - coverage-complete
      - performance
      - test
      - windows-portability-contract
      - artifact-smoke
      - security
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every production gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: detail.get("result")
              for name, detail in needs.items()
              if detail.get("result") != "success"
          }
          if failed:
              raise SystemExit(f"production gates did not pass: {failed}")
          PY
